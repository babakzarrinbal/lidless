# Babzi download page on the server: own port (:8462); never touches :443.
services:
  site:
    image: nginx:1.29-alpine
    container_name: babzi-site
    restart: unless-stopped
    ports:
      - "8462:8443"
    volumes:
      - ./www:/www:ro
      - ./tls:/tls:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    read_only: true
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
