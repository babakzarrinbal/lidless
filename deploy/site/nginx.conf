# bz-uniai site on the server: https on :8462 (self-signed; Cloudflare in
# front at https://uniai.zarrinbal.org, SSL mode "full"). Never :443.
server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /tls/cert.pem;
  ssl_certificate_key /tls/key.pem;
  error_page 497 =301 https://$host$request_uri; # plain http on the https port
  root /www;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = /healthz { return 200 "ok\n"; }
  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location ~ \.apk$ {
    types { application/vnd.android.package-archive apk; }
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "attachment; filename=bz-uniai.apk";
  }
  location / { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
}
