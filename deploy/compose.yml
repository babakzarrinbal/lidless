# Mac Remote relay on the server. Own port (:8460); never touches :443.
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    container_name: macremote-relay
    restart: unless-stopped
    ports:
      - "8460:8460"
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
volumes:
  data:
